services:
  modernblog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modernblog-web
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=DataSource=/app/Data/app.db;Cache=Shared
      - ConnectionStrings__BlogConnection=DataSource=/app/Data/blog.db;Cache=Shared
    volumes:
      # Persist database files
      - modernblog-data:/app/Data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  modernblog-data:
    driver: local
