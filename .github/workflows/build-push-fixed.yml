name: Build and Push

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test ModernBlog.slnx --nologo

  docker:
    needs: test
    permissions:
      contents: read
      packages: write

    uses: justinmarkmarshall/github-actions/.github/workflows/build-push-ghcr.yml@main